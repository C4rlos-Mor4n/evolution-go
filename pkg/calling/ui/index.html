<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Llamadas por instancia</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1d2330; --muted: #5d6677; --line: #e2e5ea;
    --accent: #2563eb; --ok: #15803d; --okbg: #e7f6ec; --warn: #a16207; --warnbg: #fdf3d7;
    --off: #4b5563; --offbg: #eceef1; --bad: #b91c1c; --badbg: #fde8e8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --card: #1b2029; --text: #e7eaf0; --muted: #9aa3b2; --line: #2b313c;
      --accent: #6b9bff; --ok: #5fd08a; --okbg: #183424; --warn: #f2c14e; --warnbg: #3a2f12;
      --off: #aab2bf; --offbg: #262c36; --bad: #ff8a8a; --badbg: #3a1c1c;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 900px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.lead { margin: 0 0 20px; color: var(--muted); }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  input[type=password], input[type=text] { flex: 1 1 220px; min-width: 0; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); font: inherit; }
  button { padding: 9px 14px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
  button.secondary { background: transparent; color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  .banner { border-radius: 8px; padding: 10px 12px; margin-bottom: 16px; background: var(--warnbg); color: var(--warn); }
  .err { background: var(--badbg); color: var(--bad); }
  .inst { display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; align-items: center; }
  .name { font-weight: 600; }
  .meta { color: var(--muted); font-size: 13px; }
  .badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 600; }
  .b-active { background: var(--okbg); color: var(--ok); }
  .b-pending_apply, .b-offline { background: var(--warnbg); color: var(--warn); }
  .b-disabled, .b-global_disabled { background: var(--offbg); color: var(--off); }
  .notice { grid-column: 1 / -1; font-size: 13.5px; color: var(--warn); }
  .actions { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; }
  label.switch { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
  label.switch input { width: 40px; height: 22px; appearance: none; background: var(--offbg); border: 1px solid var(--line); border-radius: 999px; position: relative; cursor: pointer; margin: 0; }
  label.switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--muted); transition: left .15s; }
  label.switch input:checked { background: var(--accent); border-color: var(--accent); }
  label.switch input:checked::after { left: 20px; background: #fff; }
  label.switch input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .empty { color: var(--muted); text-align: center; padding: 24px 0; }
  @media (max-width: 560px) { .inst { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>Llamadas WhatsApp por instancia</h1>
  <p class="lead">Activa la recepción de llamadas en Nix360 solo para los números autorizados. Las instancias desactivadas mantienen el comportamiento normal de WhatsApp.</p>

  <section class="panel" id="auth">
    <div class="row">
      <input type="password" id="key" placeholder="API key global" autocomplete="off" aria-label="API key global">
      <input type="text" id="actor" placeholder="Tu nombre (queda en la auditoría)" maxlength="64" aria-label="Operador">
      <button id="connect">Conectar</button>
    </div>
  </section>

  <div id="msg" hidden></div>
  <div id="list"></div>
</main>
<script>
(() => {
  const STATUS = {
    active: "Activo",
    disabled: "Desactivado",
    pending_apply: "Pendiente de aplicar",
    offline: "Sin conexión: se aplica al conectar",
    global_disabled: "Apagado en el servidor"
  };
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k) { try { return sessionStorage.getItem(k) || ""; } catch { return ""; } },
    set(k, v) { try { sessionStorage.setItem(k, v); } catch {} }
  };
  $("key").value = store.get("kx-calling-key");
  $("actor").value = store.get("kx-calling-actor");

  function esc(s) {
    return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function show(text, isError) {
    const el = $("msg");
    el.hidden = !text;
    el.className = "banner" + (isError ? " err" : "");
    el.textContent = text || "";
  }
  async function api(method, path, body) {
    const res = await fetch(path, {
      method,
      headers: { "apikey": $("key").value.trim(), "Content-Type": "application/json" },
      body: body ? JSON.stringify(body) : undefined
    });
    let data = null;
    try { data = await res.json(); } catch {}
    if (!res.ok) {
      const err = new Error((data && data.error) || ("HTTP " + res.status));
      err.status = res.status;
      throw err;
    }
    return data;
  }
  function fmtDate(v) {
    if (!v) return "";
    const d = new Date(v);
    return isNaN(d) ? "" : d.toLocaleString();
  }

  function render(data) {
    const list = $("list");
    const global = data.globalCallsEnabled;
    let html = global ? "" : '<div class="banner">CALLS_ENABLED=false en este servidor: ninguna instancia recibe llamadas en Nix360, aunque su interruptor esté activado.</div>';
    if (!data.instances.length) {
      list.innerHTML = html + '<div class="panel empty">No hay instancias.</div>';
      return;
    }
    for (const it of data.instances) {
      const changed = it.changedAt ? `Último cambio: ${esc(fmtDate(it.changedAt))}${it.changedBy ? " · " + esc(it.changedBy) : ""}` : "Sin cambios registrados";
      const calls = it.activeCalls ? ` · ${it.activeCalls} llamada(s) en curso` : "";
      html += `<section class="panel inst" data-id="${esc(it.instanceId)}">
        <div>
          <div class="name">${esc(it.name)}</div>
          <div class="meta">${it.connected ? "Conectada" : "Desconectada"}${calls} · ${changed}</div>
        </div>
        <span class="badge b-${esc(it.status)}">${esc(STATUS[it.status] || it.status)}</span>
        <div class="actions">
          <label class="switch"><input type="checkbox" data-act="toggle" ${it.callsEnabled ? "checked" : ""}> Habilitar llamadas en Nix360</label>
          ${it.status === "pending_apply" ? '<button class="secondary" data-act="apply">Aplicar (reconecta solo esta instancia)</button>' : ""}
        </div>
        ${it.notice ? `<div class="notice">${esc(it.notice)}</div>` : ""}
      </section>`;
    }
    list.innerHTML = html;
  }

  async function load() {
    if (!$("key").value.trim()) { show("Ingresa la API key global.", true); return; }
    store.set("kx-calling-key", $("key").value.trim());
    store.set("kx-calling-actor", $("actor").value.trim());
    try {
      render(await api("GET", "/calling/instances"));
      show("");
    } catch (e) {
      $("list").innerHTML = "";
      show(e.status === 401 ? "API key incorrecta." : "No se pudo cargar: " + e.message, true);
    }
  }

  $("connect").addEventListener("click", load);
  $("key").addEventListener("keydown", (e) => { if (e.key === "Enter") load(); });

  $("list").addEventListener("click", async (e) => {
    const el = e.target.closest("[data-act]");
    if (!el) return;
    const card = el.closest("[data-id]");
    const id = card.dataset.id;
    const name = card.querySelector(".name").textContent;
    if (el.dataset.act === "toggle") {
      const enabled = el.checked;
      const text = enabled
        ? `Activar llamadas para "${name}".\n\nSe guarda de inmediato. Para que empiece a recibir llamadas en Nix360 habrá que aplicar el cambio (reconecta solo esta instancia; la sesión de WhatsApp se conserva).`
        : `Desactivar llamadas para "${name}".\n\nLas nuevas llamadas dejarán de llegar a Nix360 desde ahora y sonarán normal en el teléfono. Las llamadas en curso no se cortan.`;
      if (!confirm(text)) { el.checked = !enabled; return; }
      el.disabled = true;
      try {
        await api("PUT", "/calling/instances/" + encodeURIComponent(id), { enabled, actor: $("actor").value.trim() });
        await load();
      } catch (err) {
        el.checked = !enabled;
        el.disabled = false;
        show("No se pudo guardar: " + err.message, true);
      }
    } else if (el.dataset.act === "apply") {
      if (!confirm(`Aplicar el cambio en "${name}".\n\nSe reconectará SOLO esta instancia (unos segundos). La sesión de WhatsApp se conserva. ¿Continuar?`)) return;
      el.disabled = true;
      try {
        await api("POST", "/calling/instances/" + encodeURIComponent(id) + "/apply");
        show(`"${name}" se está reconectando. Actualizando estado…`);
        setTimeout(load, 4000);
      } catch (err) {
        if (err.status === 409 && confirm(`"${name}" tiene llamadas en curso. Aplicar ahora las cortará. ¿Forzar?`)) {
          try {
            await api("POST", "/calling/instances/" + encodeURIComponent(id) + "/apply?force=true");
            setTimeout(load, 4000);
            return;
          } catch (err2) { err = err2; }
        }
        el.disabled = false;
        show("No se pudo aplicar: " + err.message, true);
      }
    }
  });

  if ($("key").value) load();
})();
</script>
</body>
</html>
